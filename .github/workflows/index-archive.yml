name: Index Dayan archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/prepare-whatsapp-export.py'
      - 'scripts/upload-sources.mjs'
      - 'scripts/bootstrap-archive.mjs'
      - 'scripts/evaluate-retrieval.mjs'
      - 'private-input/**'
      - '.github/workflows/index-archive.yml'

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing." >&2
            exit 1
          fi

      - name: Verify archive ZIP
        shell: bash
        run: |
          ZIP_COUNT=$(find private-input -maxdepth 1 -type f -iname '*.zip' | wc -l | tr -d ' ')
          if [ "$ZIP_COUNT" = "0" ]; then
            echo "No ZIP found in private-input/. Upload the WhatsApp export ZIP there first." >&2
            exit 1
          fi
          find private-input -maxdepth 1 -type f -iname '*.zip' -print

      - name: Build, index, and test retrieval
        shell: bash
        run: |
          set -o pipefail
          set +e
          node scripts/bootstrap-archive.mjs | tee /tmp/dayan-index.log
          BOOTSTRAP_STATUS=${PIPESTATUS[0]}
          set -e

          STORE=$(grep -oE 'fileSearchStores/[A-Za-z0-9_-]+' /tmp/dayan-index.log | tail -n 1)
          if [ -z "$STORE" ]; then
            echo "Could not find the File Search store name in the bootstrap output." >&2
            exit 1
          fi

          if [ "$BOOTSTRAP_STATUS" -ne 0 ]; then
            echo "Archive indexing did not reach 100%; running retrieval regression checks against the successfully indexed documents anyway."
          fi

          GEMINI_FILE_SEARCH_STORE="$STORE" node scripts/evaluate-retrieval.mjs | tee /tmp/dayan-eval.log

          {
            echo "## Gemini File Search retrieval-v2"
            echo
            echo "Indexed into the existing store:"
            echo
            echo '\`'"$STORE"'\`'
            echo
            echo "### Known-question regression checks"
            echo
            grep 'Retrieval regression summary:' /tmp/dayan-eval.log || true
            if [ "$BOOTSTRAP_STATUS" -ne 0 ]; then
              echo
              echo "Note: a small number of retrieval-v2 documents were still failed/pending; the regression checks ran against the documents that were active."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
